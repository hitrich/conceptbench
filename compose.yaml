name: conceptbench
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: conceptbench
      POSTGRES_DB: conceptbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.sh first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U conceptbench"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    image: conceptbench:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql://conceptbench:${POSTGRES_PASSWORD}@db:5432/conceptbench
    command: [sh, -c, "python backend/manage.py migrate --noinput && gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60 --access-logfile -"]
    ports:
      - "127.0.0.1:${CONCEPTBENCH_PORT:-8008}:8000"
    volumes:
      - private:/app/private
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  worker:
    image: conceptbench:local
    pull_policy: never
    env_file: .env
    environment:
      DATABASE_URL: postgresql://conceptbench:${POSTGRES_PASSWORD}@db:5432/conceptbench
    command: [python, backend/manage.py, worker]
    volumes:
      - private:/app/private
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
  private:
